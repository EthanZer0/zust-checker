[package]
name = "zust-checker"
version = "0.1.0"
description = "ZUST 教务查询桌面应用"
authors = ["ZUST"]
edition = "2021"

[lib]
name = "zust_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dirs = "6"

# 本地核心库
zust-core = { path = "../crates/zust-core" }
